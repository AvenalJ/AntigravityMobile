org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Only the Android 36 platform is installed in this environment; AGP 8.7 was
# validated against API 35, so silence its hard compileSdk check.
android.suppressUnsupportedCompileSdk=36

# Release signing credentials (override via -P or a local gradle.properties /
# ~/.gradle/gradle.properties for production). A dev keystore is generated by
# `keytool` (see README) so `assembleRelease` produces a signed, sideloadable APK.
AGM_RELEASE_STORE_FILE=keystore/release.jks
AGM_RELEASE_STORE_PASSWORD=antigravity
AGM_RELEASE_KEY_ALIAS=antigravity
AGM_RELEASE_KEY_PASSWORD=antigravity
