<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Antigravity - Lite</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path d=%22M13 2 4 14h6l-1 8 10-12h-7z%22 fill=%22%233DD6B6%22/></svg>">
    <!-- Structured chat renderer styles (.sc-*) shared with the full dashboard -->
    <link rel="stylesheet" href="/css/chat.css">
    <style>
        :root {
            /* Palette mirrors the native app theme (teal accent + dark-green
               neutral surfaces) so the chat looks like the rest of the app. */
            --bg-dark: #0F1413;
            --bg-primary: #0F1413;
            --bg-card: #151B1A;
            --bg-sidebar: #0C100F;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --bg-bubble: #1E2624;
            --accent-primary: #3DD6B6;
            --accent-strong: #2BB89B;
            --accent-glow: rgba(61, 214, 182, 0.18);
            --on-accent: #002019;
            --text-primary: #E6ECEA;
            --text-secondary: #A9B4B1;
            --text-muted: rgba(169, 180, 177, 0.55);
            --border: #2C3633;
            --success: #2FB36B;
            --error: #E5534B;
        }

        .light-theme {
            --bg-dark: #FBFCFC;
            --bg-primary: #FBFCFC;
            --bg-card: #FFFFFF;
            --bg-sidebar: #F2F5F4;
            --bg-glass: rgba(0, 0, 0, 0.04);
            --bg-bubble: #EAEFED;
            --accent-primary: #1E8F79;
            --accent-strong: #2BB89B;
            --accent-glow: rgba(30, 143, 121, 0.15);
            --on-accent: #FFFFFF;
            --text-primary: #12201D;
            --text-secondary: #49544F;
            --text-muted: rgba(73, 84, 79, 0.55);
            --border: #C8D2CF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* App shell: sidebar drawer + main */
        .app-shell {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        .logo { display: flex; align-items: center; gap: 8px; }
        .logo-icon { font-size: 22px; }
        .logo-text {
            font-size: 15px;
            font-weight: 700;
            background: var(--accent-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error); flex-shrink: 0; }
        .status-dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

        .icon-btn {
            width: 34px; height: 34px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--bg-glass); color: var(--text-primary); }
        .icon-btn.active { background: var(--accent-glow); color: var(--accent-primary); }

        /* "Hide thinking" — collapse the granular chain-of-thought step timeline,
           leaving the "Worked for…" summary and the agent's answer ("big thoughts"). */
        .hide-cot .sc-steps { display: none; }
        .hide-cot .sc-worked { margin: 0; }

        /* Sidebar (drawer) */
        .sidebar {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.22s ease;
            z-index: 200;
        }

        .sidebar-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 14px 10px;
        }
        .sidebar-head .icon-btn { display: none; } /* close button: mobile only */

        .new-convo-btn {
            margin: 0 12px 12px;
            padding: 11px 14px;
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .new-convo-btn:hover { border-color: var(--accent-primary); background: var(--accent-glow); }
        .new-convo-btn .plus { font-size: 17px; color: var(--accent-primary); }

        .sidebar-section-label {
            padding: 4px 16px 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .sidebar-section-label span { opacity: 0.7; }

        .sidebar .convo-search {
            margin: 0 12px 8px;
            padding: 9px 12px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
        }
        .sidebar .convo-search:focus { border-color: var(--accent-primary); }

        .sidebar .convo-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; -webkit-overflow-scrolling: touch; }

        .convo-item {
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13.5px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 1px;
        }
        .convo-item:hover { background: var(--bg-glass); color: var(--text-primary); }
        .convo-item.active { color: var(--text-primary); font-weight: 600; background: var(--bg-glass); box-shadow: inset 2px 0 0 var(--accent-primary); }
        .convo-empty { padding: 16px; text-align: center; color: var(--text-muted); font-size: 13px; }

        .sidebar-foot-link {
            padding: 12px 16px;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-top: 1px solid var(--border);
        }
        .sidebar-foot-link:hover { color: var(--accent-primary); }

        .sidebar-backdrop {
            display: none;
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
        }

        /* Main column */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

        .topbar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px;
            padding-top: calc(10px + env(safe-area-inset-top));
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .icon-btn svg { display: block; }
        .sidebar { padding-top: env(safe-area-inset-top); }
        .topbar-title { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
        .topbar-spacer { flex: 1; }

        /* Desktop: sidebar always visible, hide hamburger + backdrop */
        @media (min-width: 820px) {
            #sidebarToggle { display: none; }
            .sidebar-backdrop { display: none !important; }
        }

        /* Mobile/narrow: sidebar is an overlay drawer */
        @media (max-width: 819px) {
            .sidebar {
                position: absolute; top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
                box-shadow: 4px 0 24px rgba(0,0,0,0.5);
            }
            .app-shell.sidebar-open .sidebar { transform: translateX(0); }
            .app-shell.sidebar-open .sidebar-backdrop { display: block; }
            .sidebar-head .icon-btn { display: flex; }
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-card {
            text-align: center;
            padding: 32px;
        }

        .login-logo {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .pin-input {
            width: 200px;
            padding: 14px 20px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .pin-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .login-btn {
            width: 200px;
            padding: 14px;
            background: var(--accent-primary);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-error {
            color: var(--error);
            font-size: 13px;
            margin-top: 12px;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cascade-view {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px 10px;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        /* Force native touch scrolling even if IDE injects touch-action: none */
        .cascade-view * {
            touch-action: auto !important;
            overscroll-behavior: auto !important;
        }

        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 14px;
            gap: 8px;
        }

        .chat-empty .icon {
            opacity: 0.5;
            display: flex;
        }

        /* Input Area - Stays at bottom via flex */
        .input-area {
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .quick-chips {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .quick-chip {
            padding: 6px 14px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-chip:hover {
            background: var(--accent-glow);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--accent-primary);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Desktop-style overrides for the structured renderer */
        .sc-user { align-items: flex-end; }
        .sc-user .sc-bubble {
            background: var(--bg-bubble);
            color: var(--text-primary);
            border-radius: 16px 16px 4px 16px;
            max-width: 86%;
        }
        .sc-prose { color: var(--text-primary); }
        .sc-changes .ic, .sc-step-ico { color: var(--text-muted); }
        .send-btn svg { color: var(--on-accent); }
        .send-btn { color: var(--on-accent); }
        .sc-action-accept { color: var(--on-accent); }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .toast {
            padding: 12px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            animation: toastIn 0.3s ease;
        }

        .toast.success {
            border-color: var(--success);
        }

        .toast.error {
            border-color: var(--error);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cascade content styling - control injected IDE content */
        .cascade-view {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px;
            position: relative;
            min-height: 0;
            /* Important for flex children */
        }

        /* Force readable text and control layout */
        .cascade-view,
        .cascade-view * {
            color: var(--text-primary) !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }

        .cascade-view a {
            color: var(--accent-primary) !important;
        }

        /* Light theme overrides */
        .light-theme .cascade-view {
            background: #ffffff !important;
        }

        /* Ensure images and content don't overflow */
        .cascade-view img,
        .cascade-view svg {
            max-width: 100% !important;
            height: auto !important;
        }

        /* Reset raw buttons inside cascade to prevent native browser gray filling */
        .cascade-view button {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            appearance: none;
        }

        /* Remote Prompts History Display */
        .remote-prompts-container {
            width: 100%;
            max-height: 120px;
            overflow-y: hidden;
            scroll-behavior: smooth;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 16px 8px 16px;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 100%);
        }

        .remote-prompt-item {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-glass);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            width: fit-content;
            max-width: 90%;
            align-self: flex-end;
            animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            word-wrap: break-word;
        }

        .remote-prompt-item:last-child {
            color: var(--text-primary);
            border-color: var(--accent-primary);
            background: var(--accent-glow);
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Control any absolutely positioned or oversized elements */
        .cascade-view>div,
        .cascade-view>div>div,
        .cascade-view>div>div>div,
        .cascade-view>div>div>div>div,
        .cascade-view>div>div>div>div>div {
            max-height: none !important;
            min-height: 0 !important;
            height: auto !important;
            position: relative !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        /* Collapse empty elements */
        .cascade-view>div:empty,
        .cascade-view>div>div:empty {
            display: none !important;
        }

        /* Remove any fixed heights from wrappers */
        .cascade-view [style*="height"]:not(img):not(svg):not(video) {
            height: auto !important;
            min-height: 0 !important;
            max-height: none !important;
        }

        /* Hide the virtualized scroll placeholder divs (gray loading boxes) */
        .cascade-view .bg-gray-500\/10:not(:has(*)),
        .cascade-view [class*="bg-gray-500"]:not(:has(*)) {
            display: none !important;
        }

        /* Also target by the rounded-lg class pattern often used with placeholders */
        .cascade-view .rounded-lg.bg-gray-500\/10 {
            display: none !important;
        }

        /* Flatten nested flex containers */
        .cascade-view [style*="display: flex"],
        .cascade-view [style*="display:flex"] {
            display: block !important;
        }

        /* Reset any flex containers that might cause issues */
        .cascade-view [style*="flex"] {
            flex: 0 0 auto !important;
        }

        /* Prevent fixed/absolute positioning from breaking layout */
        .cascade-view [style*="position: fixed"],
        .cascade-view [style*="position: absolute"] {
            position: relative !important;
        }

        /* Hide elements with extremely large min-height (virtualized scroll containers) */
        .cascade-view [style*="min-height"] {
            min-height: 0 !important;
        }

        /* Dynamic viewport height support for modern browsers */
        @supports (height: 100dvh) {
            body {
                height: 100dvh;
            }
        }

        /* Mobile-specific fixes (up to 767px) */
        @media screen and (max-width: 767px) {
            body {
                height: 100vh;
                height: 100dvh;
                /* Dynamic viewport height - accounts for mobile browser chrome */
                min-height: 0;
                overflow: hidden;
            }

            .chat-container {
                flex: 1 1 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .cascade-view {
                flex: 1 1 0;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }

            .input-area {
                flex-shrink: 0;
                position: sticky;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px 12px;
                padding-bottom: max(10px, env(safe-area-inset-bottom));
                background: var(--bg-card);
                border-top: 1px solid var(--border);
                z-index: 50;
            }

            .quick-chips {
                gap: 6px;
                margin-bottom: 8px;
            }

            .quick-chip {
                padding: 5px 10px;
                font-size: 12px;
            }

            .input-row {
                gap: 8px;
            }

            .chat-input {
                padding: 10px 14px;
                font-size: 16px;
                /* Prevents iOS zoom on focus */
            }

            .send-btn {
                width: 40px;
                height: 40px;
                flex-shrink: 0;
            }

            .header {
                padding: 10px 12px;
            }
        }

        /* Tablet-specific fixes (768px - 1024px) */
        @media screen and (min-width: 768px) and (max-width: 1024px) {
            body {
                height: 100vh;
                height: 100dvh;
                /* Dynamic viewport height for better tablet support */
                min-height: 0;
                overflow: hidden;
            }

            .chat-container {
                flex: 1 1 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .cascade-view {
                flex: 1 1 0;
                min-height: 0;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .input-area {
                flex-shrink: 0;
                position: sticky;
                bottom: 0;
                padding-bottom: max(12px, env(safe-area-inset-bottom));
                z-index: 50;
            }
        }

        /* Keyboard visibility handling via visualViewport API */
        .keyboard-open .cascade-view {
            max-height: 40vh !important;
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div class="login-screen hidden" id="loginScreen">
        <div class="login-card">
            <div class="login-logo"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
            <div class="login-title">Enter PIN</div>
            <div class="login-subtitle">Authentication required</div>
            <input type="tel" class="pin-input" id="pinInput" maxlength="6" placeholder="••••" autocomplete="off">
            <button class="login-btn" onclick="submitPin()">Unlock</button>
            <div class="login-error" id="loginError" style="display: none;"></div>
        </div>
    </div>

    <!-- App shell: collapsible sidebar drawer + main chat (desktop-style) -->
    <div class="app-shell">

        <!-- Sidebar backdrop (mobile drawer) -->
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <div class="logo">
                    <span class="logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-primary)"><path d="M13 2 4 14h6l-1 8 10-12h-7z"/></svg></span>
                    <span class="logo-text">Antigravity</span>
                </div>
                <button class="icon-btn" onclick="closeSidebar()" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
            <button class="new-convo-btn" onclick="newConversation()">
                <span class="plus"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span> New Conversation
            </button>
            <div class="sidebar-section-label">Conversation History <span id="convoCount"></span></div>
            <input type="text" class="convo-search" id="convoSearch" placeholder="Search…" oninput="renderConvoList()">
            <div class="convo-list" id="convoList">
                <div class="convo-empty">Loading…</div>
            </div>
            <a href="/" class="sidebar-foot-link">Full Dashboard <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
        </aside>

        <!-- Main chat -->
        <main class="main">
            <header class="topbar">
                <button class="icon-btn" id="sidebarToggle" onclick="openSidebar()" title="Conversations"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
                <div class="topbar-title" id="convoTitle">Antigravity</div>
                <div class="status-dot" id="statusDot"></div>
                <div class="topbar-spacer"></div>
                <button class="icon-btn" id="cotToggle" onclick="toggleCot()" title="Hide thinking steps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg></button>
                <button class="icon-btn" id="themeToggle" onclick="toggleTheme()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            </header>

            <div class="cascade-view" id="cascade-container">
                <div class="chat-empty">
                    <span class="icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                    <span>Connecting to Antigravity...</span>
                </div>
            </div>

            <!-- Remote Prompt History -->
            <div id="remotePrompts" class="remote-prompts-container"></div>

            <div class="input-area">
                <div class="quick-chips">
                    <button class="quick-chip" onclick="sendQuick('continue')">Continue</button>
                    <button class="quick-chip" onclick="sendQuick('yes')">Yes</button>
                    <button class="quick-chip" onclick="sendQuick('no')">No</button>
                </div>
                <div class="input-row">
                    <input type="text" class="chat-input" id="chatInput" placeholder="Send a message..."
                        onkeypress="if(event.key==='Enter')sendMessage()">
                    <button class="send-btn" onclick="sendMessage()" aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        const serverUrl = window.location.origin;
        let authToken = localStorage.getItem('authToken');
        let ws = null;
        let lastCascadeHash = null;
        let cssLoaded = false;

        // ====================================================================
        // Theme
        // ====================================================================
        function initTheme() {
            // The native app passes its current theme via the URL hash
            // (#theme=dark|light) so the chat matches the rest of the app.
            const fromApp = (location.hash.match(/theme=(dark|light)/) || [])[1];
            if (fromApp) localStorage.setItem('theme', fromApp);
            const saved = fromApp || localStorage.getItem('theme') || 'dark';
            document.body.classList.toggle('light-theme', saved === 'light');
            updateThemeIcon();
        }

        // ====================================================================
        // Hide chain-of-thought (show only the summary + answer)
        // ====================================================================
        function initCot() {
            document.body.classList.toggle('hide-cot', localStorage.getItem('hideCot') === '1');
            updateCotIcon();
        }
        function toggleCot() {
            const hide = !document.body.classList.contains('hide-cot');
            document.body.classList.toggle('hide-cot', hide);
            localStorage.setItem('hideCot', hide ? '1' : '0');
            updateCotIcon();
        }
        function updateCotIcon() {
            const on = document.body.classList.contains('hide-cot');
            const btn = document.getElementById('cotToggle');
            btn.classList.toggle('active', on);
            btn.title = on ? 'Show thinking steps' : 'Hide thinking steps';
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const theme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isLight = document.body.classList.contains('light-theme');
            document.getElementById('themeToggle').innerHTML = isLight ? ic('sun', 18) : ic('moon', 18);
        }

        // ====================================================================
        // Auth
        // ====================================================================
        async function authFetch(url, options = {}) {
            const headers = { ...(options.headers || {}) };
            if (authToken) {
                headers['Authorization'] = `Bearer ${authToken}`;
            }
            const res = await fetch(url, { ...options, headers });
            if (res.status === 401) {
                try {
                    const clonedRes = res.clone();
                    const data = await clonedRes.json();
                    if (data.needsAuth) {
                        authToken = null;
                        localStorage.removeItem('authToken');
                        showLoginScreen();
                    }
                } catch (e) { }
            }
            return res;
        }

        async function checkAuth() {
            try {
                // First check if auth is enabled (no token needed for this)
                const res = await fetch(`${serverUrl}/api/auth/status`);
                const data = await res.json();

                if (!data.authEnabled) {
                    // Auth not enabled, proceed without login
                    hideLoginScreen();
                    return true;
                }

                // Auth is enabled, check if we have a valid token
                if (authToken) {
                    const testRes = await authFetch(`${serverUrl}/api/status`);
                    if (testRes.ok) {
                        hideLoginScreen();
                        return true;
                    }
                }

                // Need to login
                showLoginScreen();
                return false;
            } catch (e) {
                console.error('Auth check failed:', e);
                return false;
            }
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function hideLoginScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
        }

        async function submitPin() {
            const pin = document.getElementById('pinInput').value;
            const errorEl = document.getElementById('loginError');
            try {
                const res = await fetch(`${serverUrl}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    hideLoginScreen();
                    errorEl.style.display = 'none';
                    startPolling();
                } else {
                    errorEl.textContent = data.error || 'Invalid PIN';
                    errorEl.style.display = 'block';
                }
            } catch (e) {
                errorEl.textContent = 'Connection error';
                errorEl.style.display = 'block';
            }
        }

        // ====================================================================
        // WebSocket
        // ====================================================================
        function connectWebSocket() {
            const wsUrl = serverUrl.replace('http', 'ws') + '/ws';
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('connected');
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = () => {
                document.getElementById('statusDot').classList.remove('connected');
            };
        }

        // ====================================================================
        // Chat Polling
        // ====================================================================
        let pollTimer = null;

        function startPolling() {
            if (pollTimer) return;
            fetchChat();
            loadConversations();   // populate sidebar + topbar title
            pollTimer = setInterval(fetchChat, 2000);
        }

        // ---- SVG icon system (no emojis) -----------------------------------
        const ICONS = {
            check: '<path d="M20 6 9 17l-5-5"/>',
            edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
            run: '<path d="M4 17l6-6-6-6"/><path d="M12 19h8"/>',
            thought: '<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1h6c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
            explore: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
            dot: '<circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/>',
            fileEdit: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M10.4 12.6a2 2 0 1 1 3 3L8 21l-4 1 1-4z"/>',
            help: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
            fileText: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
            chevR: '<path d="M9 18l6-6-6-6"/>',
            chevL: '<path d="M15 18l-6-6 6-6"/>',
            x: '<path d="M18 6 6 18M6 6l12 12"/>',
            alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
            sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
            moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>',
        };
        function ic(name, size = 16, sw = 2) {
            return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.15em;flex-shrink:0">${ICONS[name] || ICONS.dot}</svg>`;
        }

        // ---- Structured chat renderer (mirrors js/chat-live.js) -------------
        const ACTIVITY_ICON = { edit: 'edit', run: 'run', thought: 'thought', explore: 'explore', step: 'dot' };

        function renderMessage(m) {
            const el = document.createElement('div');
            if (m.role === 'user') {
                el.className = 'sc-msg sc-user';
                el.innerHTML = `<div class="sc-bubble">${escapeHtml(m.text)}</div>`;
                return el;
            }
            el.className = 'sc-msg sc-agent' + (m.working ? ' sc-working' : '');
            let html = '';
            if (m.worked || (m.activity && m.activity.length)) {
                html += `<div class="sc-activity">`;
                if (m.worked) html += `<div class="sc-worked">${m.working ? '<span class="sc-spinner"></span>' : ic('check', 15)} ${escapeHtml(m.worked)}</div>`;
                if (m.activity && m.activity.length) html += `<div class="sc-steps">` + m.activity.map(a =>
                    `<div class="sc-step sc-step-${a.kind}"><span class="sc-step-ico">${ic(ACTIVITY_ICON[a.kind] || 'dot', 14)}</span>${escapeHtml(a.text)}</div>`).join('') + `</div>`;
                html += `</div>`;
            }
            if (m.text) html += `<div class="sc-prose">${m.text}</div>`;
            if (m.changes) {
                const add = m.changes.add ? `<span class="sc-add">+${escapeHtml(String(m.changes.add))}</span>` : '';
                const del = m.changes.del ? `<span class="sc-del">−${escapeHtml(String(m.changes.del))}</span>` : '';
                html += `<div class="sc-changes">${ic('fileEdit', 15)} ${escapeHtml(m.changes.summary)} ${add} ${del}</div>`;
            }
            el.innerHTML = html;
            if (m.actions && m.actions.length) {
                const bar = document.createElement('div');
                bar.className = 'sc-actions';
                m.actions.forEach(a => {
                    const btn = document.createElement('button');
                    btn.className = 'sc-action sc-action-' + a.kind;
                    btn.textContent = a.label;
                    btn.addEventListener('click', () => forwardAction(a.xpath, a.label, btn));
                    bar.appendChild(btn);
                });
                el.appendChild(bar);
            }
            return el;
        }

        async function forwardAction(xpath, label, btn) {
            btn.disabled = true; btn.style.opacity = '0.5';
            try {
                const res = await authFetch('/api/cdp/click', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ xpath, text: label })
                });
                const r = await res.json();
                showToast(r.success ? `${label}` : (r.error || 'Click failed'), r.success ? 'success' : 'error');
            } catch (e) { showToast('Network error', 'error'); }
            finally { setTimeout(() => { btn.disabled = false; btn.style.opacity = ''; }, 600); }
        }

        function renderPrompt(p) {
            const el = document.createElement('div');
            el.className = 'sc-prompt';
            let html = `<div class="sc-prompt-q">${ic('help', 16)} ${escapeHtml(p.question || 'The agent is asking a question')}</div><div class="sc-prompt-opts"></div>`;
            if (p.otherXpath) html += `<div class="sc-prompt-other"><input type="text" class="sc-prompt-input" placeholder="Write your own answer…"><button class="sc-action sc-action-accept sc-prompt-send">Send</button></div>`;
            if (p.skipXpath) html += `<button class="sc-prompt-skip">Skip</button>`;
            el.innerHTML = html;
            const optsBox = el.querySelector('.sc-prompt-opts');
            (p.options || []).forEach(o => {
                const b = document.createElement('button');
                b.className = 'sc-action sc-prompt-opt'; b.textContent = o.label;
                b.addEventListener('click', () => answerPrompt({ kind: 'option', optionXpath: o.xpath, submitXpath: p.submitXpath }, el));
                optsBox.appendChild(b);
            });
            if (p.otherXpath) {
                const input = el.querySelector('.sc-prompt-input'), send = el.querySelector('.sc-prompt-send');
                const go = () => { const t = input.value.trim(); if (t) answerPrompt({ kind: 'other', otherXpath: p.otherXpath, text: t, submitXpath: p.submitXpath }, el); };
                send.addEventListener('click', go);
                input.addEventListener('keypress', e => { if (e.key === 'Enter') go(); });
            }
            if (p.skipXpath) el.querySelector('.sc-prompt-skip').addEventListener('click', () => answerPrompt({ kind: 'skip', skipXpath: p.skipXpath }, el));
            return el;
        }

        async function answerPrompt(payload, card) {
            card.querySelectorAll('button, input').forEach(b => b.disabled = true);
            card.style.opacity = '0.6';
            try {
                const res = await authFetch('/api/chat/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const r = await res.json();
                if (r.success) { showToast('Answer sent', 'success'); lastCascadeHash = null; setTimeout(fetchChat, 400); }
                else { showToast(r.error || 'Failed', 'error'); card.querySelectorAll('button, input').forEach(b => b.disabled = false); card.style.opacity = ''; }
            } catch (e) { showToast('Network error', 'error'); card.querySelectorAll('button, input').forEach(b => b.disabled = false); card.style.opacity = ''; }
        }

        // ---- artifact viewer ----
        let artifactOverlayOpen = false;
        function renderArtifactBanner(art) {
            const el = document.createElement('div');
            el.className = 'sc-artifact-banner';
            el.innerHTML = `<span class="sc-art-ico">${ic('fileText', 18)}</span><span class="sc-art-title">${escapeHtml(art.title)}</span><span class="sc-art-open">View ${ic('chevR', 14)}</span>`;
            el.addEventListener('click', () => openArtifactOverlay(art));
            return el;
        }
        function openArtifactOverlay(art) {
            artifactOverlayOpen = true;
            let ov = document.getElementById('scArtifactOverlay');
            if (!ov) { ov = document.createElement('div'); ov.id = 'scArtifactOverlay'; ov.className = 'sc-art-overlay'; document.body.appendChild(ov); }
            ov.innerHTML = `<div class="sc-art-head"><button class="sc-art-close" aria-label="Close">${ic('x', 18)}</button><div class="sc-art-head-title">${escapeHtml(art.title)}</div><div class="sc-art-nav"><button class="sc-art-prev" ${art.prevXpath ? '' : 'disabled'}>${ic('chevL', 16)} Prev</button><button class="sc-art-next" ${art.nextXpath ? '' : 'disabled'}>Next ${ic('chevR', 16)}</button></div></div><div class="sc-art-body sc-prose">${art.html}</div>`;
            ov.style.display = 'flex';
            ov.querySelector('.sc-art-close').onclick = () => { artifactOverlayOpen = false; ov.style.display = 'none'; };
            if (art.prevXpath) ov.querySelector('.sc-art-prev').onclick = () => navArtifact(art.prevXpath);
            if (art.nextXpath) ov.querySelector('.sc-art-next').onclick = () => navArtifact(art.nextXpath);
        }
        async function navArtifact(xpath) {
            try { await authFetch('/api/cdp/click', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ xpath, text: 'artifact-nav' }) }); lastCascadeHash = null; setTimeout(fetchChat, 400); }
            catch (e) { showToast('Network error', 'error'); }
        }

        async function fetchChat() {
            try {
                const res = await authFetch(`${serverUrl}/api/chat/structured`);
                if (!res.ok) return;
                const data = await res.json();
                const container = document.getElementById('cascade-container');

                if (data.found && data.messages) {
                    const last = data.messages[data.messages.length - 1] || {};
                    const pk = data.prompt ? 'P:' + (data.prompt.question || '') + (data.prompt.options || []).map(o => o.label).join(',') : '';
                    const ak = data.artifact ? 'A:' + data.artifact.title + data.artifact.html.length : '';
                    const hash = data.messages.length + '|' + (last.text || '').length + '|' + (last.worked || '') + '|' + (last.actions || []).map(a => a.label).join(',') + '|' + pk + '|' + ak;
                    if (hash === lastCascadeHash) return;
                    lastCascadeHash = hash;

                    if (data.model) { const lbl = document.getElementById('modelLabel'); if (lbl) lbl.textContent = data.model; }
                    const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 120;
                    container.innerHTML = '';
                    if (data.artifact && data.artifact.open) {
                        container.appendChild(renderArtifactBanner(data.artifact));
                        if (artifactOverlayOpen) openArtifactOverlay(data.artifact);
                    } else if (artifactOverlayOpen) {
                        artifactOverlayOpen = false;
                        const ov = document.getElementById('scArtifactOverlay'); if (ov) ov.style.display = 'none';
                    }
                    if (data.messages.length === 0 && !data.artifact) {
                        container.innerHTML = `<div class="chat-empty"><span>No messages yet</span></div>`;
                    } else {
                        const frag = document.createDocumentFragment();
                        data.messages.forEach(m => frag.appendChild(renderMessage(m)));
                        container.appendChild(frag);
                    }
                    if (data.prompt) container.appendChild(renderPrompt(data.prompt));
                    if (atBottom) setTimeout(() => { container.scrollTop = container.scrollHeight; }, 60);
                } else if (data.error) {
                    if (lastCascadeHash !== 'err:' + data.error) {
                        lastCascadeHash = 'err:' + data.error;
                        container.innerHTML = `<div class="chat-empty"><span class="icon">${ic('alert', 38)}</span><span>${escapeHtml(data.error)}</span></div>`;
                    }
                }
            } catch (e) {
                console.log('Chat fetch error:', e);
            }
        }

        // ---- sidebar (conversation history) --------------------------------
        let allConversations = [];
        function openSidebar() {
            document.querySelector('.app-shell').classList.add('sidebar-open');
            loadConversations();
        }
        function closeSidebar() {
            document.querySelector('.app-shell').classList.remove('sidebar-open');
        }
        async function loadConversations() {
            try {
                const res = await authFetch(`${serverUrl}/api/chat/conversations`);
                const data = await res.json();
                allConversations = data.conversations || [];
                document.getElementById('convoCount').textContent = allConversations.length ? `(${allConversations.length})` : '';
                // reflect the active conversation title in the topbar
                const active = allConversations.find(c => c.active);
                if (active) document.getElementById('convoTitle').textContent = active.title;
                renderConvoList();
            } catch (e) { showToast('Failed to load conversations', 'error'); }
        }
        function renderConvoList() {
            const q = (document.getElementById('convoSearch').value || '').toLowerCase();
            const list = document.getElementById('convoList');
            const items = allConversations.filter(c => c.title.toLowerCase().includes(q));
            list.innerHTML = items.map(c =>
                `<div class="convo-item ${c.active ? 'active' : ''}" onclick="pickConversation('${c.id}')">${escapeHtml(c.title)}</div>`).join('') ||
                `<div class="convo-empty">No conversations</div>`;
        }
        async function pickConversation(id) {
            closeSidebar();
            showToast('Switching…', 'success');
            try {
                const res = await authFetch(`${serverUrl}/api/chat/conversations/switch`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                const r = await res.json();
                if (r.success) { lastCascadeHash = null; setTimeout(() => { fetchChat(); loadConversations(); }, 600); }
                else showToast(r.error || 'Switch failed', 'error');
            } catch (e) { showToast('Network error', 'error'); }
        }
        async function newConversation() {
            closeSidebar();
            showToast('New conversation…', 'success');
            try {
                const res = await authFetch(`${serverUrl}/api/chat/conversations/new`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                const r = await res.json();
                if (r.success) {
                    document.getElementById('convoTitle').textContent = 'New Conversation';
                    lastCascadeHash = null;
                    setTimeout(() => { fetchChat(); loadConversations(); }, 600);
                } else showToast(r.error || 'Failed', 'error');
            } catch (e) { showToast('Network error', 'error'); }
        }

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash;
        }

        // ====================================================================
        // Send Message
        // ====================================================================
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                const res = await authFetch(`${serverUrl}/api/cdp/inject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, submit: true })
                });
                const result = await res.json();
                if (result.success) {
                    input.value = '';
                    showToast('Sent!', 'success');
                } else {
                    throw new Error(result.error);
                }
            } catch (e) {
                showToast('Failed to send', 'error');
            }
        }

        function sendQuick(cmd) {
            document.getElementById('chatInput').value = cmd;
            sendMessage();
        }

        // ====================================================================
        // Message Handling & Remote Prompts
        // ====================================================================
        let remotePrompts = [];

        function renderRemotePrompts() {
            const container = document.getElementById('remotePrompts');
            if (!container) return;

            if (remotePrompts.length > 3) remotePrompts.shift();

            if (remotePrompts.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = remotePrompts.map(msg => `
                <div class="remote-prompt-item">${escapeHtml(msg.content)}</div>
            `).join('');

            container.scrollTop = container.scrollHeight;
        }

        // Escape HTML for minimal view
        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function handleMessage(data) {
            if (data.event === 'history' && Array.isArray(data.data.messages)) {
                const prompts = data.data.messages.filter(m => m.type === 'user' || m.type === 'mobile_command');
                prompts.forEach(msg => {
                    const isDuplicate = remotePrompts.length > 0 && remotePrompts[remotePrompts.length - 1].content === msg.content;
                    if (!isDuplicate) remotePrompts.push(msg);
                });
                renderRemotePrompts();
            } else if (data.event === 'message' || data.event === 'mobile_command') {
                if (data.data && (data.data.type === 'user' || data.data.type === 'mobile_command')) {
                    const isDuplicate = remotePrompts.length > 0 && remotePrompts[remotePrompts.length - 1].content === data.data.content;
                    if (!isDuplicate) {
                        remotePrompts.push(data.data);
                        renderRemotePrompts();
                    }
                }
            }
        }

        // ====================================================================
        // Toast
        // ====================================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ====================================================================
        // Init
        // ====================================================================
        initTheme();
        initCot();
        checkAuth().then((authOk) => {
            if (authOk) {
                connectWebSocket();
                startPolling();
            }
        });

        // PIN input - auto-focus and enter to submit
        document.getElementById('pinInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitPin();
        });

        // ====================================================================
        // Mobile Keyboard Detection using visualViewport API
        // ====================================================================
        if (window.visualViewport) {
            const initialHeight = window.visualViewport.height;

            window.visualViewport.addEventListener('resize', () => {
                const currentHeight = window.visualViewport.height;
                const keyboardOpen = currentHeight < initialHeight * 0.8;

                document.body.classList.toggle('keyboard-open', keyboardOpen);

                // Ensure input stays visible when keyboard opens
                if (keyboardOpen) {
                    const inputArea = document.querySelector('.input-area');
                    if (inputArea) {
                        inputArea.scrollIntoView({ behavior: 'instant', block: 'end' });
                    }
                }
            });
        }

        // Handle iOS Safari focus quirks
        document.getElementById('chatInput').addEventListener('focus', () => {
            setTimeout(() => {
                const inputArea = document.querySelector('.input-area');
                if (inputArea) {
                    inputArea.scrollIntoView({ behavior: 'instant', block: 'end' });
                }
            }, 300);
        });
    </script>
</body>

</html>
