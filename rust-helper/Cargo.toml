[package]
name = "rustdesk-helper"
version = "0.1.0"
edition = "2021"
description = "Full-desktop capture + input helper for Antigravity Mobile (scrap + enigo)"

[[bin]]
name = "rustdesk-helper"
path = "src/main.rs"

[dependencies]
# Phase 1: launcher/supervisor + localhost WebSocket
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
# Phase 2: desktop capture + JPEG encode
scrap = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
#   Phase 4: enigo           (input + shortcuts)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
